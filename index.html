<title>윤오 스피너 100 — 두 가지 세 가지 같이 하는 스피너</title>
<style>
  :root{
    --bg:#f4f7fb; --card:#fff; --ink:#1b2535; --sub:#64748b; --line:#e2e8f0;
    --navy:#1f3a68; --hl:#ffe680; --pop:#ff6b6b; --good:#16a34a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;}
  header{padding:18px 16px 12px; text-align:center}
  h1{margin:0; font-size:26px; letter-spacing:-.5px}
  .concl{display:inline-block; margin:10px auto 0; padding:9px 16px; border-radius:10px;
    background:var(--hl); font-size:15px; font-weight:700; color:#5b4600; line-height:1.5}
  .count{margin:8px 0 0; font-size:13px; color:var(--sub)}
  nav{position:sticky; top:0; z-index:20; background:rgba(244,247,251,.96);
    backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding:8px 10px}
  .tabs{display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto; border:1.5px solid var(--line); background:#fff; color:var(--sub);
    border-radius:999px; padding:8px 14px; font-size:14px; font-weight:700; cursor:pointer}
  .tab.on{background:var(--navy); border-color:var(--navy); color:#fff}
  main{padding:14px 12px 40px; max-width:1500px; margin:0 auto}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(146px,1fr)); gap:12px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:10px 9px 11px;
    cursor:pointer; text-align:center; transition:transform .12s, box-shadow .12s}
  .card:active{transform:scale(.96)}
  .card:hover{box-shadow:0 6px 18px rgba(31,58,104,.13)}
  .thumb{width:100%; aspect-ratio:1/1; display:block}
  .nm{margin:6px 0 0; font-size:13.5px; font-weight:700; line-height:1.35; height:36px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .cb{margin:4px 0 0; font-size:11.5px; color:var(--sub); line-height:1.3; height:30px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .row{display:flex; align-items:center; justify-content:center; gap:5px; margin-top:6px}
  .badge{font-size:11px; font-weight:800; padding:3px 7px; border-radius:7px;
    background:#eef3fb; color:var(--navy)}
  .badge.three{background:#ffe9e9; color:#c0392b}
  .pr{font-size:12px; font-weight:700; color:var(--good)}
  /* 모달 */
  .back{position:fixed; inset:0; background:rgba(14,22,38,.62); display:none; z-index:50;
    align-items:center; justify-content:center; padding:14px}
  .back.on{display:flex}
  .modal{background:#fff; border-radius:22px; width:100%; max-width:520px; max-height:94vh;
    overflow-y:auto; padding:18px 18px 20px; text-align:center}
  .big{width:230px; height:230px; margin:2px auto 0; display:block}
  .tapmsg{font-size:12px; color:var(--sub); margin:2px 0 0}
  .mtitle{margin:10px 0 0; font-size:21px; font-weight:800; line-height:1.35}
  .mcombo{margin:9px 0 0; display:inline-block; padding:8px 14px; border-radius:11px;
    background:var(--hl); font-size:15px; font-weight:700; color:#5b4600; line-height:1.5}
  .info{margin:14px 0 0; text-align:left; border-top:1px solid var(--line)}
  .info div{display:flex; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line); font-size:14px}
  .info b{flex:0 0 72px; color:var(--sub); font-weight:700}
  .info span{flex:1; line-height:1.45}
  .buy{display:block; margin:16px 0 0; padding:15px; border-radius:14px; background:var(--navy);
    color:#fff; font-size:17px; font-weight:800; text-decoration:none}
  .buy2{display:block; margin:9px 0 0; padding:13px; border-radius:14px; background:#eef3fb;
    color:var(--navy); font-size:15px; font-weight:700; text-decoration:none}
  .close{display:block; width:100%; margin:9px 0 0; padding:12px; border-radius:14px;
    border:1.5px solid var(--line); background:#fff; color:var(--sub); font-size:15px; font-weight:700; cursor:pointer}
  .spin{animation:sp 1.15s linear infinite; transform-origin:50% 50%}
  .spin.fast{animation-duration:.38s}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (max-width:420px){
    h1{font-size:22px} .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:10px}
    .big{width:195px; height:195px}
  }
</style>

const SHAPES = ['round','tri','star','gear','cross','disc','hex','petal','wave','blade'];

function pol(cx,cy,r,a){const t=(a-90)*Math.PI/180; return [cx+r*Math.cos(t), cy+r*Math.sin(t)];}
function pts(arr){return arr.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');}

/* 날개 몸체 */
function body(shape,wings,R,c){
  let s='', cx=100, cy=100;
  const step=360/wings;
  for(let i=0;i<wings;i++){
    const a=i*step;
    const [x,y]=pol(cx,cy,R*0.62,a);
    if(shape==='round'){ s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(R*0.40).toFixed(1)}" fill="${c[0]}" stroke="${c[1]}" stroke-width="3"/>`; }
    else if(shape==='tri'){ const p=[pol(cx,cy,R,a),pol(cx,cy,R*0.34,a-32),pol(cx,cy,R*0.34,a+32)];
      s+=`<polygon points="${pts(p)}" fill="${c[0]}" stroke="${c[1]}" stroke-width="3" stroke-linejoin="round"/>`; }
    else if(shape==='star'){ const p=[pol(cx,cy,R*1.02,a),pol(cx,cy,R*0.52,a+18),pol(cx,cy,R*0.30,a),pol(cx,cy,R*0.52,a-18)];
      s+=`<polygon points="${pts(p)}" fill="${c[0]}" stroke="${c[1]}" stroke-width="2.6" stroke-linejoin="round"/>`; }
    else if(shape==='gear'){ s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(R*0.37).toFixed(1)}" fill="${c[0]}" stroke="${c[1]}" stroke-width="3"/>`;
      for(let k=0;k<6;k++){ const [gx,gy]=pol(x,y,R*0.37,k*60); s+=`<circle cx="${gx.toFixed(1)}" cy="${gy.toFixed(1)}" r="${(R*0.085).toFixed(1)}" fill="${c[1]}"/>`; } }
    else if(shape==='cross'){ const p=[pol(cx,cy,R,a-11),pol(cx,cy,R,a+11),pol(cx,cy,R*0.26,a+30),pol(cx,cy,R*0.26,a-30)];
      s+=`<polygon points="${pts(p)}" fill="${c[0]}" stroke="${c[1]}" stroke-width="3" stroke-linejoin="round"/>`; }
    else if(shape==='hex'){ const p=[];for(let k=0;k<6;k++)p.push(pol(x,y,R*0.38,k*60+a));
      s+=`<polygon points="${pts(p)}" fill="${c[0]}" stroke="${c[1]}" stroke-width="3" stroke-linejoin="round"/>`; }
    else if(shape==='petal'){ const [ax,ay]=pol(cx,cy,R*0.30,a-40), [bx,by]=pol(cx,cy,R*0.30,a+40), [tx,ty]=pol(cx,cy,R*1.0,a);
      s+=`<path d="M${ax.toFixed(1)},${ay.toFixed(1)} Q${tx.toFixed(1)},${ty.toFixed(1)} ${bx.toFixed(1)},${by.toFixed(1)} Z" fill="${c[0]}" stroke="${c[1]}" stroke-width="3"/>`; }
    else if(shape==='wave'){ const [ax,ay]=pol(cx,cy,R*0.33,a-26), [bx,by]=pol(cx,cy,R*0.33,a+26),
      [m1x,m1y]=pol(cx,cy,R*1.05,a-16), [m2x,m2y]=pol(cx,cy,R*0.80,a+16);
      s+=`<path d="M${ax.toFixed(1)},${ay.toFixed(1)} C${m1x.toFixed(1)},${m1y.toFixed(1)} ${m2x.toFixed(1)},${m2y.toFixed(1)} ${bx.toFixed(1)},${by.toFixed(1)} Z" fill="${c[0]}" stroke="${c[1]}" stroke-width="3" stroke-linejoin="round"/>`; }
    else if(shape==='blade'){ const p=[pol(cx,cy,R*1.0,a-7),pol(cx,cy,R*0.95,a+16),pol(cx,cy,R*0.28,a+24),pol(cx,cy,R*0.28,a-16)];
      s+=`<polygon points="${pts(p)}" fill="${c[0]}" stroke="${c[1]}" stroke-width="2.8" stroke-linejoin="round"/>`; }
    else { s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(R*0.40).toFixed(1)}" fill="${c[0]}" stroke="${c[1]}" stroke-width="3"/>`; }
  }
  if(shape==='disc'){ s=`<circle cx="100" cy="100" r="${R.toFixed(1)}" fill="${c[0]}" stroke="${c[1]}" stroke-width="3.5"/>`;
    for(let i=0;i<wings;i++){ const [x,y]=pol(100,100,R*0.60,i*step);
      s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(R*0.17).toFixed(1)}" fill="${c[2]}" stroke="${c[1]}" stroke-width="2"/>`; } }
  return s;
}

/* 가운데 베어링 */
function hub(R,c){
  return `<circle cx="100" cy="100" r="${(R*0.33).toFixed(1)}" fill="${c[2]}" stroke="${c[1]}" stroke-width="3.2"/>`
       + `<circle cx="100" cy="100" r="${(R*0.15).toFixed(1)}" fill="${c[1]}"/>`;
}

       s+=`<circle cx="${x1.toFixed(1)}" cy="${y1.toFixed(1)}" r="${(R*0.17).toFixed(1)}" fill="none" stroke="${c[1]}" stroke-width="4.5" stroke-dasharray="${(R*0.5).toFixed(1)} ${(R*0.22).toFixed(1)}"/>`;
       const [x2,y2]=pol(100,100,R*0.86,240);
       for(let k=0;k<4;k++) s+=`<line x1="${(x2-R*0.16+k*R*0.105).toFixed(1)}" y1="${(y2-R*0.14).toFixed(1)}" x2="${(x2-R*0.16+k*R*0.105).toFixed(1)}" y2="${(y2+R*0.14).toFixed(1)}" stroke="${c[1]}" stroke-width="2.6"/>`;}
      break;
    case '날아가는것':
      for(let k=0;k<3;k++){ const a0=k*120+16;
        s+=`<path d="M${pol(100,100,R*1.14,a0)[0].toFixed(1)},${pol(100,100,R*1.14,a0)[1].toFixed(1)} A${(R*1.14).toFixed(1)},${(R*1.14).toFixed(1)} 0 0 1 ${pol(100,100,R*1.14,a0+52)[0].toFixed(1)},${pol(100,100,R*1.14,a0+52)[1].toFixed(1)}" fill="none" stroke="${c[1]}" stroke-width="3.2" stroke-linecap="round" opacity=".75"/>`; }
      atWing((x,y,a)=>{const [tx,ty]=pol(x,y,R*0.30,a+70);
        return `<path d="M${x.toFixed(1)},${y.toFixed(1)} Q${tx.toFixed(1)},${ty.toFixed(1)} ${pol(x,y,R*0.34,a+20)[0].toFixed(1)},${pol(x,y,R*0.34,a+20)[1].toFixed(1)} Z" fill="${c[2]}" stroke="${c[1]}" stroke-width="2"/>`;});
      break;
    case '캐릭터':
      s+=`<circle cx="${(100-R*0.11).toFixed(1)}" cy="${(100-R*0.07).toFixed(1)}" r="${(R*0.055).toFixed(1)}" fill="#1b2535"/>`;
      s+=`<circle cx="${(100+R*0.11).toFixed(1)}" cy="${(100-R*0.07).toFixed(1)}" r="${(R*0.055).toFixed(1)}" fill="#1b2535"/>`;
      s+=`<path d="M${(100-R*0.12).toFixed(1)},${(100+R*0.09).toFixed(1)} q${(R*0.12).toFixed(1)},${(R*0.13).toFixed(1)} ${(R*0.24).toFixed(1)},0" fill="none" stroke="#1b2535" stroke-width="2.6" stroke-linecap="round"/>`;
      atWing((x,y,a,i)=>i===0?`<path d="M${(x-R*0.19).toFixed(1)},${y.toFixed(1)} h${(R*0.38).toFixed(1)}" stroke="${c[1]}" stroke-width="3"/>`:'');
      break;
    case '촉감':
      atWing((x,y,a)=>`<path d="M${x.toFixed(1)},${(y-R*0.21).toFixed(1)} q${(R*0.17).toFixed(1)},${(R*0.21).toFixed(1)} 0,${(R*0.38).toFixed(1)} q${(-R*0.17).toFixed(1)},${(-R*0.17).toFixed(1)} 0,${(-R*0.38).toFixed(1)} Z" fill="${c[2]}" stroke="${c[1]}" stroke-width="2.2" opacity=".92"/>`);
      break;
    case '플리퍼':
      {const [ax,ay]=pol(100,100,R*1.24,90),[bx,by]=pol(100,100,R*1.24,270);
       s+=`<rect x="${(ax-R*0.52).toFixed(1)}" y="${(ay-R*0.13).toFixed(1)}" width="${(R*1.04).toFixed(1)}" height="${(R*0.26).toFixed(1)}" rx="${(R*0.12).toFixed(1)}" fill="${c[2]}" stroke="${c[1]}" stroke-width="3"/>`;
       s+=`<rect x="${(bx-R*0.52).toFixed(1)}" y="${(by-R*0.13).toFixed(1)}" width="${(R*1.04).toFixed(1)}" height="${(R*0.26).toFixed(1)}" rx="${(R*0.12).toFixed(1)}" fill="${c[2]}" stroke="${c[1]}" stroke-width="3"/>`;
       for(let k=0;k<3;k++){ s+=`<line x1="${(ax-R*0.30+k*R*0.30).toFixed(1)}" y1="${(ay-R*0.13).toFixed(1)}" x2="${(ax-R*0.30+k*R*0.30).toFixed(1)}" y2="${(ay+R*0.13).toFixed(1)}" stroke="${c[1]}" stroke-width="2"/>`;
         s+=`<line x1="${(bx-R*0.30+k*R*0.30).toFixed(1)}" y1="${(by-R*0.13).toFixed(1)}" x2="${(bx-R*0.30+k*R*0.30).toFixed(1)}" y2="${(by+R*0.13).toFixed(1)}" stroke="${c[1]}" stroke-width="2"/>`; }}
      break;
    case '반지팔찌':
      s+=`<circle cx="100" cy="100" r="${(R*1.26).toFixed(1)}" fill="none" stroke="${c[1]}" stroke-width="${(R*0.17).toFixed(1)}" opacity=".88"/>`;
      s+=`<circle cx="100" cy="100" r="${(R*1.26).toFixed(1)}" fill="none" stroke="${c[2]}" stroke-width="${(R*0.05).toFixed(1)}"/>`;
      break;
    case '돌림판공부':
      atWing((x,y,a,i)=>`<text x="${x.toFixed(1)}" y="${(y+R*0.11).toFixed(1)}" font-size="${(R*0.30).toFixed(1)}" font-weight="800" fill="${c[2]}" text-anchor="middle">${[['2','4','6','8','3','5'],['1','2','3','4','5','6'],['＋','－','×','÷','＝','％'],['가','나','다','라','마','바']][v%4][i%6]}</text>`);
      break;
    default: /* 기타결합 */
      atWing((x,y,a,i)=>{const p=[pol(x,y,R*0.21,0),pol(x,y,R*0.09,36),pol(x,y,R*0.21,72),pol(x,y,R*0.09,108),pol(x,y,R*0.21,144),pol(x,y,R*0.09,180),pol(x,y,R*0.21,216),pol(x,y,R*0.09,252),pol(x,y,R*0.21,288),pol(x,y,R*0.09,324)];
        return `<polygon points="${pts(p)}" fill="${c[2]}" stroke="${c[1]}" stroke-width="1.8"/>`;});
  }
  return s;
}

function spinnerSVG(it, idx, big){
  const pal = PAL[it.lane] || PAL['기타결합'];
  const c = pal[idx % pal.length];
  const shape = SHAPES[(idx*3+it.lane.length) % SHAPES.length];
  const wings = [3,3,4,5,6,3,4,6][(idx+it.lane.length) % 8];
  const R = 52;
  const inner = body(shape, wings, R, c) + hub(R, c);
  const dec = deco(it.lane, wings, R, c, idx);
  const fixed = (it.lane==='열쇠고리'||it.lane==='펜필기'||it.lane==='팽이요요'||it.lane==='반지팔찌');
  return `<svg class="${big?'big':'thumb'}" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">`
    + (fixed ? `<g class="rotor"><g>${inner}</g></g>${dec}` : `<g class="rotor"><g>${inner}${dec}</g></g>`)
    + `</svg>`;
}

/* ───────── 화면 ───────── */
const LANE_LABEL = {
  불빛:'불빛 나는 것', 열쇠고리:'가방에 다는 것', 펜필기:'볼펜·펜', 큐브퍼즐:'큐브·퍼즐',
  팝잇:'팝잇·뽁뽁이', 자석:'자석', 팽이요요:'팽이·요요', 날아가는것:'날아가는 것',
  캐릭터:'캐릭터', 촉감:'말랑·촉감', 플리퍼:'접이식 플리퍼', 반지팔찌:'반지·팔찌',
  돌림판공부:'돌림판·공부', 만들기과학:'만들기·과학'
};
let cur = '전체';

function lanes(){
  const seen=[]; ITEMS.forEach(i=>{ if(!seen.includes(i.lane)) seen.push(i.lane); });
  return seen;
}
function drawTabs(){
  const t=document.getElementById('tabs');
  const all=['전체'].concat(lanes());
  t.innerHTML = all.map(l=>`<button class="tab${l===cur?' on':''}" data-l="${l}">${l==='전체'?'전체 '+ITEMS.length:(LANE_LABEL[l]||l)}</button>`).join('');
  t.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cur=b.dataset.l; drawTabs(); drawGrid(); window.scrollTo({top:0,behavior:'smooth'});});
}
function drawGrid(){
  const g=document.getElementById('grid');
  const list = ITEMS.map((it,i)=>({it,i})).filter(o=>cur==='전체'||o.it.lane===cur);
  g.innerHTML = list.map(o=>`
    <div class="card" data-i="${o.i}">
      ${spinnerSVG(o.it, o.i, false)}
      <p class="nm">${o.it.short}</p>
      <p class="cb">${o.it.combo}</p>
      <div class="row">
        <span class="badge${o.it.count>=3?' three':''}">${o.it.count>=3?'세 가지':'두 가지'}</span>
        <span class="pr">${o.it.pshort}</span>
      </div>
    </div>`).join('');
  g.querySelectorAll('.card').forEach(c=>c.onclick=()=>open(+c.dataset.i));
}
function open(i){
  const it=ITEMS[i];
  document.getElementById('modal').innerHTML = `
    ${spinnerSVG(it,i,true)}
    <p class="tapmsg">그림을 누르면 돌아갑니다</p>
    <p class="mtitle">${it.name}</p>
    <div class="mcombo">${it.combo}</div>
    <div class="info">
      <div><b>가격</b><span>${it.price}</span></div>
      <div><b>파는 곳</b><span>${it.mall}</span></div>
      <div><b>재미</b><span>${it.why}</span></div>
      <div><b>조심할 것</b><span>${it.age}</span></div>
    </div>
    ${it.link ? `<a class="buy" href="${it.link}" target="_blank" rel="noopener">사는 곳 보기 →</a>` : ''}
    <a class="${it.link?'buy2':'buy'}" href="${it.search}" target="_blank" rel="noopener">${it.link?'값 비교하고 더 찾아보기':'사는 곳 찾아보기 →'}</a>
    <button class="close" id="cl">닫기</button>`;
  const back=document.getElementById('back');
  back.classList.add('on');
  const svg=document.querySelector('#modal svg');
  const rotor=svg.querySelector('.rotor');
  let on=false;
  svg.onclick=()=>{ on=!on; rotor.classList.toggle('spin',on); rotor.classList.toggle('fast',on); };
  document.getElementById('cl').onclick=close;
}
function close(){ document.getElementById('back').classList.remove('on'); }
document.getElementById('back').onclick=e=>{ if(e.target.id==='back') close(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });

drawTabs(); drawGrid();
</script>
